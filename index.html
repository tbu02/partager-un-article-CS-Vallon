<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partager l'article</title>
</head>
<body style="margin:0; padding:0; background:transparent; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

<div id="csv-share" style="display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:4px; box-sizing:border-box;">
  <a id="csv-fb-btn" href="#" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; gap:8px; background:#B42B2C; color:#ffffff; border:0; border-radius:999px; padding:10px 20px; font-size:14px; font-weight:bold; text-decoration:none;">
    Facebook
  </a>
  <button id="csv-copy-btn" style="display:inline-flex; align-items:center; gap:8px; background:#ffffff; color:#1a1a1a; border:1px solid #E7DCDB; border-radius:999px; padding:10px 20px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;">
    Partager le lien
  </button>
  <span id="csv-copy-msg" style="display:none; font-size:13px; color:#1a1a1a; font-weight:600;">
    ✓ Lien copié dans le presse-papier
  </span>
</div>

<script>
  // On récupère le lien de l'article collé après le # dans l'URL de cet iframe.
  var raw = location.hash.slice(1);
  var articleUrl = raw ? decodeURIComponent(raw) : '';

  if (!articleUrl) {
    document.getElementById('csv-share').innerHTML =
      '<span style="font-size:13px;color:#8A7D7C;">Lien de l\'article manquant dans l\'adresse de l\'iframe.</span>';
  } else {
    document.getElementById('csv-fb-btn').href =
      'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(articleUrl);

    document.getElementById('csv-copy-btn').addEventListener('click', function () {
      navigator.clipboard.writeText(articleUrl).then(function () {
        var msg = document.getElementById('csv-copy-msg');
        msg.style.display = 'inline';
        setTimeout(function () { msg.style.display = 'none'; }, 2500);
      });
    });
  }
</script>

</body>
</html>
