<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partager l'article</title>
</head>
<body style="margin:0; padding:0; background:transparent; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

<div id="csv-share-wrap" style="display:inline-block;">

  <button id="csv-share-btn" style="display:inline-flex; align-items:center; gap:8px; background:#B42B2C; color:#ffffff; border:0; border-radius:999px; padding:12px 22px; font-size:15px; font-weight:bold; font-family:inherit; cursor:pointer; letter-spacing:0.01em;">
    Partager l'article
  </button>

  <div id="csv-share-menu" style="display:none; margin-top:8px; background:#ffffff; border:1px solid #E7DCDB; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,0.12); padding:8px; width:220px; box-sizing:border-box; flex-direction:column; gap:2px;">
    <!-- items injected by JS -->
  </div>

</div>

<script>
(function () {
  var raw = location.hash.slice(1);
  var articleUrl = raw ? decodeURIComponent(raw) : '';
  var articleTitle = "CS Vallon";

  var btn = document.getElementById('csv-share-btn');
  var menu = document.getElementById('csv-share-menu');

  if (!articleUrl) {
    btn.textContent = 'Lien manquant';
    btn.style.background = '#8A7D7C';
    btn.disabled = true;
    return;
  }

  function itemStyle() {
    return 'display:flex; align-items:center; gap:8px; width:100%; box-sizing:border-box; background:none; border:0; border-radius:8px; padding:10px 12px; font-size:14px; font-weight:600; font-family:inherit; color:#1a1a1a; cursor:pointer; text-align:left; text-decoration:none;';
  }

  function closeMenu() { menu.style.display = 'none'; }

  function buildMenu() {
    var encodedUrl = encodeURIComponent(articleUrl);
    var encodedTitle = encodeURIComponent(articleTitle);

    var items = [
      { label: 'Copier le lien', action: 'copy' },
      { label: 'Facebook', href: 'https://www.facebook.com/sharer/sharer.php?u=' + encodedUrl },
      { label: 'X', href: 'https://twitter.com/intent/tweet?url=' + encodedUrl + '&text=' + encodedTitle },
      { label: 'LinkedIn', href: 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodedUrl },
      { label: 'Instagram (story)', action: 'instagram' }
    ];

    items.forEach(function (item) {
      var el;
      if (item.href) {
        el = document.createElement('a');
        el.href = item.href;
        el.target = '_blank';
        el.rel = 'noopener';
      } else {
        el = document.createElement('button');
      }
      el.textContent = item.label;
      el.style.cssText = itemStyle();
      el.onmouseenter = function () { el.style.background = '#FAF7F6'; };
      el.onmouseleave = function () { el.style.background = 'none'; };

      if (item.action === 'copy') {
        el.addEventListener('click', function () {
          navigator.clipboard.writeText(articleUrl).then(function () {
            el.textContent = '\u2713 Lien copi\u00e9 !';
            setTimeout(function () { el.textContent = item.label; closeMenu(); }, 1500);
          }).catch(function () {
            el.textContent = 'Copie impossible ici';
          });
        });
      } else if (item.action === 'instagram') {
        el.addEventListener('click', function () {
          navigator.clipboard.writeText(articleUrl).then(function () {
            alert("Lien copi\u00e9 ! Ouvre Instagram, cr\u00e9e une story et colle le lien (sticker \u00ab lien \u00bb).");
            closeMenu();
          });
        });
      } else {
        el.addEventListener('click', closeMenu);
      }

      menu.appendChild(el);
    });
  }

  buildMenu();

  btn.addEventListener('click', function (e) {
    if (navigator.share) {
      navigator.share({ title: articleTitle, url: articleUrl }).catch(function () {});
    } else {
      menu.style.display = (menu.style.display === 'none' || !menu.style.display) ? 'flex' : 'none';
    }
  });

  document.addEventListener('click', function (e) {
    if (!document.getElementById('csv-share-wrap').contains(e.target)) closeMenu();
  });
})();
</script>

</body>
</html>
